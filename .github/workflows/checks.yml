name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Generate placeholder Firebase config
        # firebase_options_{dev,prod}.dart are gitignored (per-developer,
        # from `flutterfire configure`) so analyze has nothing to resolve
        # lib/main.dart's imports against without these. Values are dummy.
        run: |
          for env in dev prod; do
            cat > lib/firebase_options_$env.dart <<'EOF'
          import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;

          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform => const FirebaseOptions(
              apiKey: 'placeholder',
              appId: 'placeholder',
              messagingSenderId: 'placeholder',
              projectId: 'placeholder',
            );
          }
          EOF
          done
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
