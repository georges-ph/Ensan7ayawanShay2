<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Human, Animal, Thing word game">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Ensan 7ayawan Shay2">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Ensan 7ayawan Shay2</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { height: 100%; margin: 0; background: #F7F4FF; }

    /* Shown while Flutter downloads and starts: the app's image filling up. */
    #loading {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: #F7F4FF;
      color: #6C4CF1;
      font: 600 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
      transition: opacity 0.3s ease;
    }

    #loading.done { opacity: 0; pointer-events: none; }

    #loading .fill { position: relative; width: 96px; height: 96px; }
    #loading .fill img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
    #loading .fill .empty { opacity: 0.2; filter: grayscale(1); }
    #loading .fill .full { animation: fill 2.2s ease-in-out infinite; }

    @keyframes fill {
      0% { clip-path: inset(100% 0 0 0); }
      70%, 100% { clip-path: inset(0 0 0 0); }
    }

    @media (prefers-reduced-motion: reduce) {
      #loading .fill .full { animation: none; }
    }
  </style>
</head>
<body>
  <div id="loading" role="status" aria-label="Loading Ensan 7ayawan Shay2">
    <div class="fill" aria-hidden="true">
      <img class="empty" src="icons/Icon-192.png" alt="">
      <img class="full" src="icons/Icon-192.png" alt="">
    </div>
    <span>Loading...</span>
  </div>

  <script>
    // Flutter fires this once its first frame is on screen.
    window.addEventListener('flutter-first-frame', function () {
      var loading = document.getElementById('loading');
      if (!loading) return;
      loading.classList.add('done');
      setTimeout(function () { loading.remove(); }, 400);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
